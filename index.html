<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Velocity Marine</title>
<style>
  :root { color-scheme: light dark; --bg: #f6f8fa; --fg: #1f2328; --muted: #656d76; --accent: #0969da; --card: #ffffff; --border: #d0d7de; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0d1117; --fg: #e6edf3; --muted: #8b949e; --accent: #58a6ff; --card: #161b22; --border: #30363d; } }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; background: var(--bg); color: var(--fg); min-height: 100vh; display: grid; place-items: center; padding: 16px; }
  main { max-width: 560px; width: 100%; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 32px; }
  h1 { margin: 0 0 8px; font-size: 2rem; }
  p { line-height: 1.5; margin: 0 0 12px; color: var(--muted); }
  .badge { display: inline-block; font-size: .8rem; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--accent); color: var(--accent); margin-bottom: 16px; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .9em; }
  a { color: var(--accent); }
  footer { margin-top: 20px; font-size: .85rem; color: var(--muted); }
</style>
</head>
<body>
<main>
  <span class="badge">Test deployment</span>
  <h1>Velocity Marine</h1>
  <p>This page is served by GitHub Pages from the <code>velocitymarine1-prog.github.io</code> repository.</p>
  <p>Edit <code>index.html</code> and push to <code>main</code> to update the site.</p>
  <footer>Deployed 2026-09-21 · <a href="https://github.com/velocitymarine1-prog/velocitymarine1-prog.github.io">Source on GitHub</a></footer>
</main>
</body>
</html>
